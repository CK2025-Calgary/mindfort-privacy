<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MindFort Privacy Policy</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 {
        color: #333;
      }
      a.button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: background-color 0.3s ease;
      }
      a.button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MindFort Privacy Policy</h1>
      <p>Please review our privacy policy below:</p>
      <a class="button" href="https://raw.githubusercontent.com/ck2025-calgary/mindfort-privacy/main/privacy-policy.md" target="_blank">
        View Privacy Policy
      </a>
    </div>
  </body>
</html>
